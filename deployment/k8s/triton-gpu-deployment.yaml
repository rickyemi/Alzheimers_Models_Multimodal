# Scalable GPU serving with NVIDIA Triton Inference Server (dynamic batching, TensorRT/ONNX backends).
# The FastAPI service performs preprocessing and calls Triton over gRPC for high-volume screening programs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-ad-mm
  namespace: ad-mm
spec:
  replicas: 1
  selector: {matchLabels: {app: triton-ad-mm}}
  template:
    metadata: {labels: {app: triton-ad-mm}}
    spec:
      nodeSelector: {nvidia.com/gpu.present: "true"}
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver:24.08-py3
          args: ["tritonserver", "--model-repository=/models", "--strict-model-config=false", "--metrics-port=8002"]
          ports: [{containerPort: 8000, name: http}, {containerPort: 8001, name: grpc}, {containerPort: 8002, name: metrics}]
          resources: {limits: {nvidia.com/gpu: 1, memory: 8Gi}, requests: {cpu: "2", memory: 4Gi}}
          readinessProbe: {httpGet: {path: /v2/health/ready, port: http}, initialDelaySeconds: 20}
          volumeMounts: [{name: model-repo, mountPath: /models}]
      volumes:
        - name: model-repo
          persistentVolumeClaim: {claimName: ad-mm-model-repo}     # synced from the model registry (MLflow / S3)
---
apiVersion: v1
kind: Service
metadata: {name: triton-ad-mm, namespace: ad-mm}
spec:
  selector: {app: triton-ad-mm}
  ports: [{name: grpc, port: 8001, targetPort: 8001}, {name: http, port: 8000, targetPort: 8000}, {name: metrics, port: 8002}]
